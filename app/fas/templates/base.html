<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}เข้าสู่ระบบ{% endblock %} — {{ gateway_name }}</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1a1d21; --muted:#666f7a;
    --line:#e2e6ea; --accent:#0b6b5e; --accent-ink:#fff;
    --err:#a01b1b; --err-bg:#fdeaea; --warn:#8a5a00; --warn-bg:#fff6e0;
    --ok:#1e6b34; --ok-bg:#e6f4ea;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14171a; --card:#1c2024; --ink:#e8eaed; --muted:#9aa4af;
           --line:#2c3238; --accent:#2aa08c; --accent-ink:#08130f;
           --err-bg:#3a1c1c; --warn-bg:#3a2f10; --ok:#7fd49a; --ok-bg:#16301f; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font:16px/1.6 system-ui,"Noto Sans Thai",-apple-system,sans-serif;
       background:var(--bg);color:var(--ink);padding:1.5rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:1.75rem;max-width:380px;width:100%}
  h1{font-size:1.25rem;margin:0 0 .3rem;text-align:center}
  .sub{color:var(--muted);text-align:center;font-size:.9rem;margin-bottom:1.25rem}
  label{display:block;font-weight:600;margin:.85rem 0 .3rem;font-size:.88rem}
  input[type=text],input[type=password]{
    width:100%;padding:.7rem .8rem;border:1px solid var(--line);border-radius:8px;
    background:var(--bg);color:var(--ink);font:inherit;letter-spacing:.02em}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  button{width:100%;margin-top:1.1rem;background:var(--accent);color:var(--accent-ink);
         border:0;border-radius:8px;padding:.75rem;font:inherit;font-weight:700;
         cursor:pointer;font-size:1rem}
  .msg{padding:.65rem .85rem;border-radius:8px;margin-bottom:.85rem;font-size:.9rem}
  .msg.err{background:var(--err-bg);color:var(--err)}
  .msg.warn{background:var(--warn-bg);color:var(--warn)}
  .msg.ok{background:var(--ok-bg);color:var(--ok)}
  .hint{color:var(--muted);font-size:.8rem;text-align:center;margin-top:1rem;line-height:1.5}
  a{color:var(--accent)}
  .staff{display:block;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--line);text-align:center}
  .staff a{display:inline-block;padding:.5rem 1rem;border:1px solid var(--line);border-radius:8px;
           color:var(--muted);text-decoration:none;font-size:.88rem}
  .staff a:hover{color:var(--accent);border-color:var(--accent)}
  .staff small{display:block;color:var(--muted);font-size:.75rem;margin-top:.35rem}
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="card">{% block body %}{% endblock %}
{% block staff %}
<div class="staff">
  <a href="{{ admin_url }}" target="_blank" rel="noopener">🔒 เข้าสู่ระบบสำหรับแอดมินและพนักงาน</a>
  <small>ถ้าเปิดไม่ขึ้นในหน้าต่างเล็กนี้ ให้เปิดเบราว์เซอร์ (Chrome/Safari) แล้วพิมพ์ {{ admin_url.split('/login')[0] }}</small>
</div>
{% endblock %}
</div>
</body>
</html>
